name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify privacy/project invariants
        run: python3 scripts/verify_project.py

      - name: Prepare fixed DEV signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GUARDIAN_DEV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GUARDIAN_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GUARDIAN_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GUARDIAN_DEV_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Guardian DEV signing secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/guardian-dev-upload-key.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "GUARDIAN_DEV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GUARDIAN_DEV_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GUARDIAN_DEV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GUARDIAN_DEV_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build fixed-signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify fixed DEV certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print \
            | sort -V \
            | tail -n 1
          )"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in Android build-tools."
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"

          ACTUAL="$(
            printf '%s\n' "$CERT_OUTPUT" \
            | grep -E 'certificate SHA-256 digest:' \
            | head -n 1 \
            | sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '\r[:space:]'
          )"

          EXPECTED="4a40d0075db9691b16814e40d7db589fdfea59a046a006c1a4db07c8901b8986"

          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected DEV signing certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Fixed DEV signing certificate verified: $ACTUAL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-android-0.1.12-fixed-signed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
